version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: rzd_postgres
    environment:
      POSTGRES_DB: rzd_drop
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: